name: Set up the project
description: Python, poetry, and the dependencies every job needs, from cache.

outputs:
  embedding:
    description: EMBEDDING_MODEL from backend.env, for a Hugging Face cache key.
    value: ${{ steps.models.outputs.embedding }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      id: python
      with:
        # Below 3.14: gensim builds against CPython internals removed there,
        # which is why pyproject stops short of it. Both images are 3.13.
        python-version: "3.13"

    # The version that wrote poetry.lock (its first line says which).
    - name: Install poetry
      shell: bash
      run: pipx install poetry==2.3.2

    # In the workspace rather than in poetry's own directory, so one cache
    # entry covers the environment and the spaCy pipelines installed into it.
    - name: Keep the virtualenv in the workspace
      shell: bash
      run: echo "POETRY_VIRTUALENVS_IN_PROJECT=true" >> "$GITHUB_ENV"

    # The spaCy pipelines `make install` downloads, read as the Makefile reads
    # them: the names from NLP_MODELS in backend.env, the version from the
    # Dockerfile. The names rather than a hash of backend.env, which every
    # tuning edit would turn into a full install. And EMBEDDING_MODEL, which
    # is what a job's Hugging Face cache holds.
    - name: Read the model names
      id: models
      shell: bash
      run: |
        names=$(sed -n 's/^NLP_MODELS=//p' configs/env/backend.env | tr ',' '\n' | cut -d: -f2 | paste -sd+ -)
        version=$(sed -n 's/^ARG SPACY_MODEL_VERSION=//p' backend/api/Dockerfile)
        echo "spacy=$names-$version" >> "$GITHUB_OUTPUT"
        echo "embedding=$(sed -n 's/^EMBEDDING_MODEL=//p' configs/env/backend.env | tr / -)" >> "$GITHUB_OUTPUT"

    # Keyed on the lock, the Makefile's install recipe and the pipelines
    # above. A miss costs the full install, torch included.
    - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
      id: cache
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.models.outputs.spacy }}-${{ hashFiles('poetry.lock', 'Makefile') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make install-python

    # A restored virtualenv carries absolute paths, so it is only usable
    # where it was built. The key holds the full patch version for that
    # reason; this is what says so out loud if it ever stops being true.
    - name: Check the environment is usable
      shell: bash
      run: |
        poetry run python --version
        poetry run python -c "import spacy, gensim, sqlalchemy, fastapi, docling"
        poetry run python -c "import de_core_news_md, en_core_web_md"
