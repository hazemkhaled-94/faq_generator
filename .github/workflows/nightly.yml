name: Nightly

# What is worth knowing but not worth blocking a merge on: advisories
# against the locks, and how the served model is reading. Neither can fail
# a pull request, and neither should.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Repeat the test order of an earlier run, from the seed printed at its top
        type: number
        required: false

permissions:
  contents: read

jobs:
  # As in ci.yml: one install fills the cache the rest restore, rather than
  # three in parallel each fetching the same pipelines.
  setup:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup

  audit:
    name: Advisories
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup

      # Reported, never gated: an advisory with no fixed version yet is not
      # a reason to stop merging. torch is held out of the backend lock
      # here; see the comment on the target.
      - run: make audit

  # The whole suite including the image builds, so a dependency that broke
  # overnight is found before somebody opens a pull request into it.
  everything:
    name: Every layer
    needs: setup
    # A hang once ran this job to GitHub's six-hour limit; the slowest green run took 51 minutes.
    timeout-minutes: 110
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Make room for the images
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: ./.github/actions/setup
        id: setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ github.job }}-${{ steps.setup.outputs.embedding }}
      # compose.yaml requires every secret, and the model and address the
      # containers call, which only .env.example declares.
      - run: cp .env.example .env
      # A thousand examples per property where CI runs 200 and a laptop
      # runs 25, which is the budget nothing else has time for. The golden
      # conversions are the weights job's, the one that fetches them.
      # A dispatched run may repeat an earlier order by its seed.
      - run: poetry run pytest -m "not eval and not perf and not slow" ${SEED:+-p randomly --randomly-seed="$SEED"}
        env:
          HYPOTHESIS_PROFILE: nightly
          SEED: ${{ inputs.seed }}

  # Whether a test would notice a gate changing. Line coverage says the
  # line ran; this changes it and asks whether anything fails. Reported and
  # never gated: a surviving mutant is sometimes a mutant nobody should
  # care about, and that judgement is a person's. A harness that runs no mutant
  # is a failure, and fails the job.
  mutation:
    name: Mutation ${{ matrix.module }}
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # One runner to a mutated file, so the job takes the largest file's share
    # and not all six. The names are pyproject's [tool.mutmut] source_paths as
    # mutmut names them, `src.` stripped.
    strategy:
      fail-fast: false
      matrix:
        module:
          - question_generation.gates
          - question_generation.balance
          - question_generation.selection
          - question_generation.models
          - question_generation.planning
          - extraction.validation
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
        id: setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ github.job }}-${{ steps.setup.outputs.embedding }}
      # Every line of one file is mutated: gates.py alone is some two thousand
      # mutants. A planning.py run of 253 went at 5.3 mutants a second on three
      # children; a shard is not measured, so it is boxed: out of time at 270
      # minutes it ends with what it covered, and the summary says how much
      # that was. Anything else non-zero is the harness failing, and fails.
      - name: Mutate
        run: |
          status=0
          timeout 270m make mutation MUTANTS="${{ matrix.module }}.*" || status=$?
          if [ "$status" -eq 124 ]; then
            # Out of time passes only if it got to a mutant: a harness that hung
            # before its first one has run none, and fails.
            ln -sfn backend src
            checked=$(poetry run mutmut results --all true | grep -F " ${{ matrix.module }}." | grep -vc ': not checked$' || true)
            rm -f src
            if [ "${checked:-0}" -gt 0 ]; then
              echo "::warning::mutation ran out of time after $checked mutants; the summary lists what it covered"
              exit 0
            fi
            echo "::error::no mutant was checked in 270 minutes"
            exit 1
          fi
          exit "$status"
      # The link `make mutation` removes is what mutmut finds its files through.
      - name: Put the survivors in the job summary
        if: always()
        run: |
          ln -sfn backend src
          {
            echo '## Mutants of ${{ matrix.module }} that survived'
            echo '```'
            poetry run mutmut results | grep -F "${{ matrix.module }}." || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f src

  # The tests that need real weights skip on a laptop with none. Here a
  # missing weight is the failure: the models are fetched at their pinned
  # revisions (EMBEDDING_MODEL_REVISION, NLI_MODEL_REVISION, where
  # configs/env/backend.env sets them), the run is offline, and
  # REQUIRE_MODELS=1 turns a skip into an error. The log shows the duplicate
  # verdict table and the golden PDFs as run, not skipped.
  weights:
    name: Real weights
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
        id: setup
      # Docling's weights land in the Hugging Face cache too, with
      # DOCLING_ARTIFACTS_PATH unset, at the revisions its release pins: the
      # key carries that release, or the first one's weights are kept forever.
      - name: Read the Docling release
        id: docling
        run: echo "version=$(sed -n '/^name = "docling"$/{n;s/^version = "\(.*\)"$/\1/p;}' poetry.lock)" >> "$GITHUB_OUTPUT"
      - name: Cache the models
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ github.job }}-${{ steps.setup.outputs.embedding }}-docling-${{ steps.docling.outputs.version }}
      - name: Fetch the models at their pinned revisions
        run: |
          set -a; . configs/env/backend.env; set +a
          poetry run python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          for model, revision in (
              ("EMBEDDING_MODEL", "EMBEDDING_MODEL_REVISION"),
              ("NLI_MODEL", "NLI_MODEL_REVISION"),
          ):
              snapshot_download(os.environ[model], revision=os.environ.get(revision) or None)
          PY
          PYTHONPATH=backend poetry run python -m preprocessing.parsing.weights
      - name: Run what needs them
        env:
          HF_HUB_OFFLINE: "1"
          REQUIRE_MODELS: "1"
        run: >
          poetry run pytest -rs
          tests/unit/nlp/test_embedding.py
          tests/regression/test_fact_refusals.py
          tests/unit/chunking/test_chunking.py
          tests/golden
      # The snapshots were recorded on another system: what this runner
      # converts is kept, so a refresh for Linux is taken from it.
      - name: Convert the golden PDFs again into their snapshots
        if: failure()
        run: make golden-refresh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: golden-snapshots-linux
          path: tests/golden/snapshots
          retention-days: 14

  # The ceilings the code names in a comment. Reported rather than gated: a
  # wall-clock budget on a shared runner measures the runner.
  ceilings:
    name: Ceilings
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - run: make test-perf
        continue-on-error: true

  # Skips itself while LLM_MODEL is unset, so the run shows skipped and not a
  # success that measured nothing; a named model that does not answer fails
  # it. Setting the repository variable LLM_MODEL and the three AZURE_*
  # secrets is the repository owner's step (docs/operations.md).
  evaluate:
    name: Model quality
    needs: setup
    if: ${{ vars.LLM_MODEL != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - name: Score the golden passages
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        run: poetry run pytest -m eval -s
