name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push over a push cancels the older one, which is
# otherwise a runner testing a commit nobody has now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Installs once and fills the cache the rest restore. Without it all four
  # jobs below install in parallel on a cold cache, each pulling the same
  # 77 MB of spaCy pipelines from GitHub's release downloads at the same
  # moment, and then three of the four throw their work away, because only
  # one save of a given key wins.
  setup:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup

  # Ruff, pyright and the drift gates: the settings every module reads
  # against the files that declare them, the migration chain, the extensions
  # the schema needs, and the locks against what they are built from.
  static:
    name: Static
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - run: make lint
      # Named as their own steps rather than left to tests/static, so a
      # broken contract or a dead dependency reads as itself in the job
      # summary instead of as one failing test among the rest.
      - run: make lint-imports
      - run: make deps
      # Measured too: the pinned-surface gates import the app and every
      # service to read them, and the combined figure is short by that
      # much without this third share of it.
      - run: poetry run pytest tests/static --cov --cov-report= --cov-fail-under=0
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.static
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-static
          path: .coverage.static
          include-hidden-files: true
          retention-days: 1

  # Everything that needs neither a container nor a served model: the unit
  # layers, the properties, the contract shapes and the Streamlit pages.
  unit:
    name: Unit
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
        id: setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ github.job }}-${{ steps.setup.outputs.embedding }}
      # HYPOTHESIS_PROFILE: 200 examples where a laptop runs 25. See the
      # profiles in tests/conftest.py.
      - run: >-
          poetry run pytest
          -m "not integration and not smoke and not eval and not perf and not slow"
          --ignore=tests/static --cov --cov-report= --cov-fail-under=0
        env:
          HYPOTHESIS_PROFILE: ci
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.unit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1

  # Postgres and SeaweedFS, started by testcontainers against the runner's
  # own Docker. Includes the API, the contract and the end-to-end layers,
  # all of which are marked integration.
  integration:
    name: Integration
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
        id: setup
      - name: Cache the chunker's tokenizer
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ github.job }}-${{ steps.setup.outputs.embedding }}
      - name: Pull the images the fixtures start
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull chrislusf/seaweedfs:4.44
      - run: poetry run pytest -m "integration and not perf" --cov --cov-report= --cov-fail-under=0
        env:
          HYPOTHESIS_PROFILE: ci
      # Named for the job: pytest-cov combines its own workers into one
      # `.coverage`, so three artifacts of that name would overwrite each
      # other on the way back down rather than combine.
      - name: Keep this job's share of the coverage
        run: mv .coverage .coverage.integration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  # Builds both images and looks inside them. Minutes rather than seconds,
  # because the backend image installs torch - but it is the only layer that
  # can see what an image contains, and a lock that does not install is not
  # worth finding out about after the merge.
  smoke:
    name: Smoke
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The backend image is torch-sized and a runner has about 14 GB free.
      - name: Make room for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: ./.github/actions/setup
      # compose.yaml requires every secret, and the model and address the
      # containers call, which only .env.example declares.
      - run: cp .env.example .env
      - run: make test-smoke

  # The deployment as a platform starts it: compose.yaml alone, with none of the
  # checkout mounted, so every image runs from its own files and the
  # environment. A reduced stack (Postgres, SeaweedFS, the api, the parse and
  # chunk workers and Dagster) is brought up and waited for on its health checks,
  # and the orchestrator smoke tests then send every GraphQL document to the
  # running Dagster. Two PDFs are then uploaded and parsed and chunked by a
  # Dagster run, which is what proves the path end to end. Only on a push to
  # main (the release push) and a manual run: it builds both images and starts
  # twelve containers.
  stack:
    name: Stack without mounts
    needs: setup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # bash with -eo pipefail for every step, so a failing command before a pipe
    # to tee fails the step.
    defaults:
      run:
        shell: bash
    env:
      # Not named COMPOSE, which make reads as the engine to run.
      DC: docker compose --env-file configs/env/deployment.env --env-file .env
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The backend image is torch-sized and a runner has about 14 GB free.
      - name: Make room for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: ./.github/actions/setup
      # Generated secrets, as an operator's first run has them: the api refuses
      # every write on the placeholder `.env.example` ships.
      - run: make setup
      - name: Build the backend and orchestration images
        run: $DC build api dagster-webserver
      - name: Start the database and the object store
        # The two volume servers are named because nothing depends on them, and
        # the master's replication (001) needs both before a PUT can be placed.
        run: $DC up -d --wait postgres seaweedfs-s3 seaweedfs-volume seaweedfs-volume2
      # From the host, against the published port, before any worker starts: a
      # worker that finds no tables fails its first claim.
      - name: Apply the schema
        run: make schema
      # Docling's weights are read offline from the `models` volume, so they are
      # fetched into it once, from a container of the image under test.
      - name: Fetch Docling's weights into the models volume
        run: make COMPOSE="docker compose" CONTAINER=docker docling-weights
      - name: Start the rest, from the images alone
        run: $DC up -d --wait api parse-worker chunk-worker dagster-webserver dagster-daemon
        env:
          COMPOSE_PROFILES: orchestrated
      - name: Send every orchestrator query to the running Dagster
        # A skip is a failure here: that file skips when the webserver does not
        # answer, which after `--wait` means it died.
        run: |
          poetry run pytest -m smoke tests/smoke/test_orchestrator_queries.py -rs | tee smoke.txt
          ! grep -q " skipped" smoke.txt
      # The two shopping PDFs the golden tests already hold (CC BY 4.0, see
      # tests/golden/pdfs/ATTRIBUTION.txt), through the api's upload route.
      - name: Upload two PDFs
        run: |
          token=$(sed -n 's/^API_TOKEN=//p' .env)
          port=$(sed -n 's/^BACKEND_PORT=//p' configs/env/deployment.env)
          for pdf in tests/golden/pdfs/shopping_de.pdf tests/golden/pdfs/shopping_en.pdf; do
            curl -fsS -H "X-API-Token: $token" -F "file=@$pdf" "http://127.0.0.1:$port/documents"
            echo
          done
      # Launched the way the pages launch it: the api's own route asks the
      # Orchestrator port, which asks Dagster for the `corpus` job. The api
      # refuses a run under HOST_RUNNER=1, which `make setup` copies from
      # .env.example, so this stack runs as the development profile does.
      - name: Launch the corpus job through the api
        run: |
          sed -i 's/^HOST_RUNNER=.*/HOST_RUNNER=0/' .env
          COMPOSE_PROFILES=orchestrated $DC up -d --wait api
          token=$(sed -n 's/^API_TOKEN=//p' .env)
          port=$(sed -n 's/^BACKEND_PORT=//p' configs/env/deployment.env)
          curl -fsS -X POST -H "X-API-Token: $token" "http://127.0.0.1:$port/pipeline/run"
      # Parsing and chunking are done by the workers this stack has. The job goes
      # on to extraction, which has none here, so the run is stopped once both
      # documents are chunked.
      - name: Wait for both documents to be parsed and chunked
        run: |
          token=$(sed -n 's/^API_TOKEN=//p' .env)
          port=$(sed -n 's/^BACKEND_PORT=//p' configs/env/deployment.env)
          python3 - "$port" <<'PY'
          import json, sys, time, urllib.request
          url = f"http://127.0.0.1:{sys.argv[1]}/pipeline"
          deadline = time.monotonic() + 900
          while True:
              state = json.load(urllib.request.urlopen(url, timeout=10))
              stages = {one["stage"]: one["rows"] for one in state["stages"]}
              failed = {name: rows for name, rows in stages.items() if rows.get("failed")}
              assert not failed, failed
              if stages["parsing"].get("parsed") == 2 and stages["chunking"].get("chunked") == 2:
                  print(stages)
                  break
              assert time.monotonic() < deadline, ("not done in 15 minutes", stages)
              time.sleep(10)
          PY
          curl -fsS -X POST -H "X-API-Token: $token" "http://127.0.0.1:$port/pipeline/stop"
      - name: What the containers said
        if: failure()
        run: |
          $DC ps -a
          $DC logs --tail=80
        env:
          COMPOSE_PROFILES: orchestrated
      - name: Take the stack down
        if: always()
        run: $DC down -v
        env:
          COMPOSE_PROFILES: orchestrated

  # The two halves put together. Neither job covers the other's: the
  # repositories are the integration layer's and the gates are the unit
  # layer's, so a threshold against either alone is against the wrong
  # number. The floor is [tool.coverage.report] fail_under in pyproject.
  coverage:
    name: Coverage
    needs: [static, unit, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: poetry run coverage combine
      - run: poetry run coverage report
      - name: Put the figure in the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            poetry run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One job for a branch protection rule to require, so adding a job above
  # does not mean editing the rule.
  gate:
    name: All gates
    if: always()
    needs: [setup, static, unit, integration, smoke, stack, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Report which gates did not pass
        run: |
          echo "setup:       ${{ needs.setup.result }}"
          echo "static:      ${{ needs.static.result }}"
          echo "unit:        ${{ needs.unit.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "smoke:       ${{ needs.smoke.result }}"
          echo "stack:       ${{ needs.stack.result }}"
          echo "coverage:    ${{ needs.coverage.result }}"
          [ "${{ needs.setup.result }}" = "success" ] \
            && [ "${{ needs.static.result }}" = "success" ] \
            && [ "${{ needs.unit.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ] \
            && { [ "${{ needs.stack.result }}" = "success" ] || [ "${{ needs.stack.result }}" = "skipped" ]; } \
            && [ "${{ needs.coverage.result }}" = "success" ]
