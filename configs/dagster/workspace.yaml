# Dagster workspace — the code locations, which are the Python packages
# holding the assets, jobs, schedules and sensors.
# Baked into the orchestration image and copied into DAGSTER_HOME at start, as
# dagster.yaml is.
#
# One location. `orchestration` is a top-level package beside `telemetry`,
# on PYTHONPATH in the image.
#
# python_module rather than python_package: the project is not installed
# (package-mode = false in pyproject.toml), so there is no distribution for
# Dagster to look up by name.

load_from:
  - python_module:
      module_name: orchestration
      location_name: qa_generator
